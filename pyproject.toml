[tool.pytest.ini_options]
# Both the agent and the fuzzer suites are hermetic: they use test doubles,
# the targets' Python reference runners and temporary directories, so they
# run on every push without fetching a target or building a harness. The
# replay job in CI additionally exercises the real sanitizer harness end to
# end through scripts/ci.py --replay.
testpaths = ["agent", "fuzzer"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["agent", "fuzzer"]
branch = true
omit = [
    "agent/test_*.py",
    "fuzzer/test_*.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
